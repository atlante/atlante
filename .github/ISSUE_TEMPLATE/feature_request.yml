name: Feature request
description: Propose a new feature or improvement
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What are you trying to do that you can't do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you'd like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about.
    validations:
      required: false

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Scope, acceptance criteria, sketches, examples — anything that helps clarify the request.
    validations:
      required: false
