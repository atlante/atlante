name: Bug report
description: Something is broken or behaving unexpectedly
type: Bug
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Atlante version:
        OpenCode version:
        Bun version:
        OS:
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Logs, screenshots, configuration snippets, or anything else that helps.
    validations:
      required: false
