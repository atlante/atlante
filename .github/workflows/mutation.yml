name: Mutation verification

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile

      # Mutation evidence is regenerated manually with mutation:test and is
      # allowed to lag behind source changes. This job verifies the stored
      # evidence chain and score ratchets on a schedule; stale evidence fails
      # the build so a regeneration is requested.
      - run: bun run mutation:verify --strict
