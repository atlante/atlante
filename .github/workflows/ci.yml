name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single full gate, and the required `check` status: build, type,
  # lint, every test tier, the CLI smoke, and both host smokes.
  # It runs on every pull request and on every push to main, always and
  # without path gating, because the main ruleset requires the `check`
  # status to be reported on every pull request. There is no separate
  # light tier: the parallel runner inside full:check aborts on the first
  # failing lane, so cheap failures still surface fast.
  #
  # The smoke tests exist because every other test calls the command
  # handlers as functions: a broken shebang, a mis-wired Commander option,
  # or an import that only fails at process start would pass the suite and
  # still ship a CLI that does not run. The CLI smoke exercises the binary
  # as a user does, and the host smokes boot the real pinned hosts against
  # built projects and assert the native agents and skills are discovered —
  # the only automated checks of the full pack → build → materialize →
  # host discovery flow.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile
      - run: bun run full:check
