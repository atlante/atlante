name: ci-pr

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile

      # Light PR tier: type, lint, and unit tests for a fast inner loop.
      - run: bun run quick:check

  # Full PR gate under the required `check` status: build, type, lint, every
  # test tier, and the CLI smoke, plus the OpenCode host smoke. It always
  # runs (no path gating) because the main ruleset requires the `check`
  # status to be reported on every pull request.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile

      # full:check runs a CLI smoke test. Every other test calls the
      # command handlers as functions, so a broken shebang, a mis-wired
      # Commander option, or an import that only fails at process start would
      # pass the suite and still ship a CLI that does not run. The smoke test
      # exercises the binary as a user does.
      - run: bun run full:check

      # The OpenCode host discovers native agent/skill files straight from
      # disk with no runtime plugin, so the unit suite cannot catch a build
      # that materializes nothing. Boot the real OpenCode CLI against a
      # project built by the CLI and assert the native architect agent and
      # skills are discovered with host-owned config merged.
      - name: OpenCode host smoke
        run: bun scripts/opencode-smoke.ts
