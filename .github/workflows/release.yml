name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            echo "Unable to extract a version from tag: $GITHUB_REF" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build
        shell: bash
        run: bun run build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm for Trusted Publishing
        shell: bash
        run: npm install --global npm@11.5.1

      - name: Publish packages
        shell: bash
        run: bun scripts/publish-packages.ts "$VERSION"

  create-release:
    needs: publish-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    needs: publish-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Wait for the released CLI on npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          for attempt in $(seq 1 30); do
            if npm view "@atlante/cli@$VERSION" version >/dev/null 2>&1; then
              echo "@atlante/cli@$VERSION is available on npm"
              exit 0
            fi
            echo "Waiting for @atlante/cli@$VERSION on npm (attempt $attempt/30)..."
            sleep 10
          done
          echo "@atlante/cli@$VERSION did not become available in time" >&2
          exit 1

      - name: Install website dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix website --no-package-lock --no-audit --no-fund

      - name: Pull Vercel project settings
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npx vercel@59.3.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build website artifacts
        shell: bash
        working-directory: website
        run: |
          set -euo pipefail
          npx vercel@59.3.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Bundle pack assets into the playground function
        shell: bash
        run: |
          set -euo pipefail
          cp -R website/node_modules/@atlante/pack \
            website/.vercel/output/functions/api/playground.func/website/node_modules/@atlante/pack

      - name: Deploy website to Vercel
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@59.3.0 deploy --prebuilt --prod website --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

  deploy-docs:
    needs: publish-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"

      - name: Install dependencies
        shell: bash
        run: bun install --frozen-lockfile

      - name: Sync docs brand assets
        shell: bash
        working-directory: docs
        run: |
          set -euo pipefail
          bun run sync:brand

      - name: Pull Vercel project settings
        shell: bash
        working-directory: docs
        run: |
          set -euo pipefail
          npx vercel@59.3.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}

      - name: Build docs artifacts
        shell: bash
        working-directory: docs
        run: |
          set -euo pipefail
          npx vercel@59.3.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}

      - name: Deploy docs to Vercel
        shell: bash
        run: |
          set -euo pipefail
          npx vercel@59.3.0 deploy --prebuilt --prod docs --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
