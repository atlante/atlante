name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF" ]]; then
            echo "Unable to extract a version from tag: $GITHUB_REF" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version $VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          bun install --frozen-lockfile

      - name: Build
        shell: bash
        run: bun run build

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm for Trusted Publishing
        shell: bash
        run: npm install --global npm@11.5.1

      - name: Publish packages
        shell: bash
        run: bun scripts/publish-packages.ts "$VERSION"

  create-release:
    needs: publish-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-website:
    needs: publish-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy schema files
        run: |
          cp -r packages/schema/schema website/
          cp -r packages/templates/schema website/schema/template
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42.3.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: website/
