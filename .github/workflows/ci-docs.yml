name: ci-docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "brand/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/ci-docs.yml"

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile

      # Builds the docs site (syncing brand assets) and runs the docs
      # workspace's whole internal test suite, including the built-output
      # assertions.
      - run: bun run docs:check
