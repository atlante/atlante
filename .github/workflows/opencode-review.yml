name: opencode-review

on:
  pull_request:
    types: [ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Act as a senior engineer doing final PR review. Focus on:

            1. Architectural coherence — Does this fit the existing patterns?
            2. Integration risks — What breaks downstream/upstream?
            3. Hidden complexity — What's not obvious from surface inspection?
            4. Future-proofing — How will this age?
            5. Security at flow level — Not just syntax, but data flow risks

            Output format:
            - Critical issues (must fix before merge)
            - Recommendations (should fix soon)
            - Observations (nice to have)

            Be specific with line references. Don't repeat what pre-review likely caught.
