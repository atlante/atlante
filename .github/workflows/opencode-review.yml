name: opencode-review

on:
  pull_request:
    types: [ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: number

concurrency:
  group: opencode-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Build pull_request event payload (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ inputs.pr_number }} \
            --jq '{ action: "synchronize", number: .number, pull_request: ., repository: { owner: { login: .base.repo.owner.login }, name: .base.repo.name } }' \
            > "$RUNNER_TEMP/event.json"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_name == 'workflow_dispatch' && format('{0}/event.json', runner.temp) || github.event_path }}
          # Security: the CLI checks out the PR head branch, which is attacker-controlled.
          # Ignore project opencode.json(c), .opencode/, and AGENTS.md/CLAUDE.md/CONTEXT.md
          # from the checked-out head so a malicious PR cannot inject config or instructions
          # into the reviewer agent (see github.handler.ts checkoutLocalBranch).
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          # Read-only review posture: deny every tool with side effects or exfiltration
          # potential (shell, network, file writes, subagents, MCP) while keeping
          # read-only file inspection available for line-level review.
          OPENCODE_PERMISSION: '{"bash":"deny","webfetch":"deny","edit":"deny","task":"deny","mcp__*":"deny","read":"allow","glob":"allow","grep":"allow"}'
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Act as a senior engineer doing final PR review. Focus on:

            1. Architectural coherence — Does this fit the existing patterns?
            2. Integration risks — What breaks downstream/upstream?
            3. Hidden complexity — What's not obvious from surface inspection?
            4. Future-proofing — How will this age?
            5. Security at flow level — Not just syntax, but data flow risks

            Output format:
            - Critical issues (must fix before merge)
            - Recommendations (should fix soon)
            - Observations (nice to have)

            Be specific with line references. Don't repeat what pre-review likely caught.
