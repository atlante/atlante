name: ci-website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "brand/**"
      # The website build publishes the committed JSON Schema verbatim
      # (website/scripts/sync-schema.ts).
      - "packages/schema/schema/**"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - ".github/workflows/ci-website.yml"

permissions:
  contents: read

concurrency:
  group: ci-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ".bun-version"
      - run: bun install --frozen-lockfile

      # Builds the landing site (syncing brand assets and the published
      # schema) and runs the website workspace's whole internal test suite,
      # including the deployment contract and the built-output assertions.
      - run: bun run website:check
